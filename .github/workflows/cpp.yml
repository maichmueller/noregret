name: C++ CI

on: [ push, pull_request ]

jobs:
  precommit_checks:
    runs-on: 'ubuntu-latest'
    name: Pre-Commit Checks
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
      - name: Update pip
        run: |
          python -m pip install --upgrade pip
      - name: Install and run pre-commit
        uses: pre-commit/action@v3.0.0
        with:
          extra_args: --all-files


  matrix-strategy-setup:
    needs: precommit_checks
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          TASKS=$(echo $(cat .github/workflows/build-matrix.json) | sed 's/ //g' )
          echo "matrix=$TASKS" >> $GITHUB_OUTPUT

  build-test-install:
    needs: matrix-strategy-setup
    name: ${{ matrix.config.container }} • ${{ matrix.config.build_type }}
    runs-on: ${{ matrix.config.os }}
    # NOR requires GCC 16.1 or newer with C++26 reflection. The Ubuntu toolchain PPA only publishes
    # a pre-release GCC 16 snapshot, which the project's compiler probe rejects, so the compiler
    # comes from the official image that actually ships the required release.
    container: ${{ matrix.config.container }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.matrix-strategy-setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install build tooling
        shell: bash
        run: .github/scripts/install-ci-tooling.sh

      - name: Resolve the Conan home
        id: conan
        shell: bash
        run: echo "CONAN_HOME=$HOME/.conan2-lib-${{ matrix.config.build_type }}" >> $GITHUB_OUTPUT

      - name: Cache Conan Dependencies Install
        id: cache-conan-deps
        uses: actions/cache@v4
        env:
          cache-name: cache-conan-deps
        with:
          path: ${{ steps.conan.outputs.CONAN_HOME }}
          key: ${{ runner.os }}-${{ env.cache-name }}-${{ matrix.config.build_type }}-${{ hashFiles('**/conandata.yml') }}-${{ hashFiles('**/conanfile.py') }}

      - name: Configure CMake
        shell: bash
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: >
          export CONAN_HOME=${{ steps.conan.outputs.CONAN_HOME }} &&
          cmake
          -S .
          -B ./build
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="conan_provider.cmake"
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DENABLE_BUILD_SANDBOX:BOOL=OFF
          -DWARNINGS_AS_ERRORS:BOOL=OFF

      - name: Build NOR Games
        shell: bash
        run: |
          cmake --build ./build --config ${{ matrix.config.build_type }} --target game_test_all

      - name: Build NOR Library
        shell: bash
        run: |
          cmake --build ./build --config ${{ matrix.config.build_type }} --target nor_tests_all

      - name: Run Game Implementation Tests
        shell: bash
        run: >
          GTEST_OUTPUT=xml:gtest-report-${{ github.job }}-games.xml
          GTEST_COLOR=1
          ctest -R Test_game_.+_test
          --test-dir ./build
          --verbose
          -C ${{ matrix.config.build_type }}

      - name: Upload game test result artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gtest-results-games
          path: ./build/**/gtest-report-${{ github.job }}-games.xml
          retention-days: 1

      - name: Run No-Regret Tests
        shell: bash
        run: >
          GTEST_OUTPUT=xml:gtest-report-${{ github.job }}-lib.xml
          GTEST_COLOR=1
          ctest -R Test_nor_tests_all
          --test-dir ./build
          --verbose
          -C ${{ matrix.config.build_type }}

      - name: Upload lib test result artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gtest-results-lib
          path: ./build/**/gtest-report-${{ github.job }}-lib.xml
          retention-days: 1

  python-bindings:
    needs: matrix-strategy-setup
    name: Python bindings • ${{ matrix.config.container }}
    runs-on: ${{ matrix.config.os }}
    container: ${{ matrix.config.container }}
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.matrix-strategy-setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Install build tooling
        shell: bash
        run: .github/scripts/install-ci-tooling.sh

      - name: Resolve the Conan home
        id: conan
        shell: bash
        run: echo "CONAN_HOME=$HOME/.conan2-bindings-${{ matrix.config.build_type }}" >> $GITHUB_OUTPUT

      - name: Cache Conan Dependencies Install
        uses: actions/cache@v4
        with:
          path: ${{ steps.conan.outputs.CONAN_HOME }}
          key: ${{ runner.os }}-conan-bindings-${{ matrix.config.build_type }}-${{ hashFiles('**/conandata.yml') }}-${{ hashFiles('**/conanfile.py') }}

      - name: Configure CMake
        shell: bash
        env:
          CC: ${{ matrix.config.cc }}
          CXX: ${{ matrix.config.cxx }}
        run: >
          export CONAN_HOME=${{ steps.conan.outputs.CONAN_HOME }} &&
          cmake
          -S .
          -B ./build
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="conan_provider.cmake"
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build_type }}
          -DENABLE_BUILD_PYTHON_EXTENSION:BOOL=ON
          -DINSTALL_PYMODULE:BOOL=ON
          -DENABLE_BUILD_SANDBOX:BOOL=OFF
          -DENABLE_BUILD_BENCHMARK:BOOL=OFF
          -DWARNINGS_AS_ERRORS:BOOL=OFF

      # The runtime registry partitions share a serial job pool: one game's concrete solver set is
      # instantiated at a time on purpose, so this step is long by construction.
      - name: Build the binding runtime and its tests
        shell: bash
        run: cmake --build ./build --config ${{ matrix.config.build_type }} --target nor_tests_binding_runtime

      - name: Build the Python extension
        shell: bash
        run: cmake --build ./build --config ${{ matrix.config.build_type }} --target noregret

      - name: Run binding runtime tests
        shell: bash
        run: >
          GTEST_OUTPUT=xml:gtest-report-${{ github.job }}-binding-runtime.xml
          GTEST_COLOR=1
          ctest -R Test_nor_tests_binding_runtime
          --test-dir ./build
          --verbose
          -C ${{ matrix.config.build_type }}

      - name: Run Python binding tests
        shell: bash
        run: ctest -R Test_python --test-dir ./build --output-on-failure -C ${{ matrix.config.build_type }}

      - name: Upload binding test result artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gtest-results-binding-runtime
          path: ./build/**/gtest-report-${{ github.job }}-binding-runtime.xml
          retention-days: 1

  publish-gtest-results:
    name: "Publish GTest Results"
    needs: [build-test-install, python-bindings]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/gtest-results_downloaded
          pattern: gtest-results*
          merge-multiple: true

      - name: Display structure of downloaded files
        if: ${{ hashFiles('artifacts/**/*.xml') != '' }}
        run: ls
        working-directory: ./artifacts/gtest-results_downloaded

      - name: Publish Unit Test Results
        if: ${{ hashFiles('artifacts/**/*.xml') != '' }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: ./artifacts/**/*.xml
